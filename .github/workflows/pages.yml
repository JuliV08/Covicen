name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # El sistema avisa al publicar un cuadro (repository_dispatch) y la web se reconstruye sola.
  repository_dispatch:
    types: [datos-publicados]
  # Una vez por día (03:00 en Argentina): los cuadros programados a futuro entran el día que corresponde.
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sin dominio: URL de Pages del repo. Cuando haya dominio: PUBLIC_SITE_URL=https://covicen.com.ar, PUBLIC_BASE_PATH=/, PUBLIC_INDEXABLE=true
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
      PUBLIC_INDEXABLE: "false"
      # Sin la variable de repositorio API_URL, la landing sigue leyendo del repo. Con ella, lee tramo y
      # tarifario de la API del sistema (el resto sigue en el repo hasta que exista su sistema).
      FUENTE_DATOS: ${{ vars.API_URL != '' && 'api' || 'local' }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm verificar
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
