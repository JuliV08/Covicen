name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sin dominio: URL de Pages del repo. Cuando haya dominio: PUBLIC_SITE_URL=https://covicen.com.ar, PUBLIC_BASE_PATH=/, PUBLIC_INDEXABLE=true
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
      PUBLIC_INDEXABLE: "false"
      FUENTE_DATOS: local
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm verificar
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
